let current=0;
function render(){
 current=+document.getElementById('variant').value;
 const quiz=document.getElementById('quiz'); quiz.innerHTML='';
 tests[current].forEach((q,i)=>{
   const div=document.createElement('div'); div.className='question';
   let s=`<div class="qtitle">${i+1}. ${q[0]}</div>`;
   q[1].forEach((o,j)=>s+=`<label class="option" id="q${i}o${j}"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${o}</label>`);
   div.innerHTML=s; quiz.appendChild(div);
 });
 document.getElementById('result').style.display='none'; updateProgress();
 document.querySelectorAll('input').forEach(x=>x.addEventListener('change',updateProgress));
}
function updateProgress(){
 const n=document.querySelectorAll('input[type=radio]:checked').length;
 document.getElementById('bar').style.width=(n/20*100)+'%';
}
function checkTest(){
 let score=0;
 tests[current].forEach((q,i)=>{
   const chosen=document.querySelector(`input[name=q${i}]:checked`);
   if(chosen){
     const val=+chosen.value;
     if(val===q[2]) score++;
     document.getElementById(`q${i}o${q[2]}`).classList.add('correct');
     if(val!==q[2]) document.getElementById(`q${i}o${val}`).classList.add('wrong');
   } else document.getElementById(`q${i}o${q[2]}`).classList.add('correct');
 });
 let grade=score>=18?'Өте жақсы!':score>=15?'Жақсы!':score>=10?'Қанағаттанарлық.':'Қайталап дайындалу қажет.';
 const r=document.getElementById('result');
 r.innerHTML=`<div class="score">${score} / 20 балл</div><div class="grade">${grade}</div><p>Нәтиже: ${score*5}%</p><p class="small">Жасыл — дұрыс жауап, қызыл — таңдалған қате жауап.</p>`;
 r.style.display='block'; r.scrollIntoView({behavior:'smooth'});
}
render();
</script>
